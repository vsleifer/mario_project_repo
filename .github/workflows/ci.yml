# Runs the linter and the full test suite against PostgreSQL on every pull
# request and on every push to main. Branch protection on main requires the
# "lint-and-test" check to pass before a pull request can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: grad_school_party
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for CI only; real secrets live in Render, never in git.
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/grad_school_party
      # The CI database has no TLS; DEBUG=True turns off the SSL requirement in settings.
      DEBUG: "True"
      # Make sure no test can reach the real LLM.
      OPENROUTER_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity 2
