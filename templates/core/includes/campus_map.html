{% comment %}
Illustrated map of central New Haven, north up. Not to scale: streets and
landmarks are simplified, but each school's pin sits where its building is.
Pin positions live in core/schools.py (MAP_PINS).
{% endcomment %}
<figure class="nh-map">
  <svg viewBox="0 0 800 560" role="group" aria-labelledby="nh-map-title">
    <title id="nh-map-title">Map of Yale's campus in New Haven with the six schools you can visit</title>

    <rect class="map-land" x="0" y="0" width="800" height="560"/>
    <path class="map-water" d="M800 470 C 740 480 700 520 690 560 L 800 560 Z"/>
    <text class="map-water-label" x="742" y="540">Harbor</text>
    <path class="map-park" d="M610 0 L 800 0 L 800 70 C 740 60 690 40 650 0 Z"/>
    <text class="map-area-label" x="712" y="30">East Rock ↗</text>

    <!-- Neighborhood blocks -->
    <rect class="map-campus" x="250" y="250" width="120" height="120" rx="4"/>
    <text class="map-area-label" x="310" y="305" text-anchor="middle">Old</text>
    <text class="map-area-label" x="310" y="320" text-anchor="middle">Campus</text>
    <rect class="map-campus" x="250" y="180" width="160" height="58" rx="4"/>
    <text class="map-area-label" x="404" y="234" text-anchor="end">Cross Campus</text>
    <path class="map-campus" d="M400 30 L 520 30 L 540 150 L 420 150 Z"/>
    <text class="map-area-label" x="496" y="124" text-anchor="middle">Science Hill</text>
    <rect class="map-campus" x="100" y="470" width="190" height="80" rx="4"/>
    <text class="map-area-label" x="195" y="545" text-anchor="middle">Medical Center</text>

    <rect class="map-green" x="384" y="252" width="150" height="128" rx="4"/>
    <text class="map-green-label" x="459" y="312" text-anchor="middle">New Haven</text>
    <text class="map-green-label" x="459" y="330" text-anchor="middle">Green</text>

    <!-- Streets -->
    <g class="map-streets">
      <path d="M0 390 L 800 390"/>            <!-- Chapel -->
      <path d="M0 244 L 560 244"/>            <!-- Elm -->
      <path d="M180 206 L 470 206"/>          <!-- Wall -->
      <path d="M150 160 L 640 160"/>          <!-- Grove / Trumbull -->
      <path d="M376 160 L 376 560"/>          <!-- College -->
      <path d="M542 140 L 542 560"/>          <!-- Church -->
      <path d="M236 100 L 236 470"/>          <!-- York -->
      <path d="M560 160 L 700 0"/>            <!-- Whitney -->
      <path d="M430 160 L 410 0"/>            <!-- Prospect -->
      <path d="M0 230 L 236 330"/>            <!-- Broadway / Elm -->
    </g>
    <path class="map-highway" d="M0 452 L 560 452"/>
    <g class="map-street-labels">
      <text x="640" y="384">Chapel St</text>
      <text x="40" y="238">Elm St</text>
      <text x="262" y="200">Wall St</text>
      <text x="580" y="154">Grove St</text>
      <text x="382" y="550" transform="rotate(-90 382 550)">College St</text>
      <text x="548" y="550" transform="rotate(-90 548 550)">Church St</text>
      <text x="230" y="300" transform="rotate(-90 230 300)" text-anchor="middle">York St</text>
      <text x="636" y="56" transform="rotate(-49 636 56)">Whitney Ave</text>
      <text x="438" y="150" transform="rotate(-82 438 150)">Prospect St</text>
      <text x="420" y="446">Route 34</text>
    </g>

    <!-- North arrow -->
    <g class="map-compass" transform="translate(48 64)">
      <path d="M0 -22 L 9 8 L 0 2 L -9 8 Z"/>
      <text y="26" text-anchor="middle">N</text>
    </g>

    <!-- School pins -->
    {% for tile in tiles %}
      <a href="{% url 'play_school' tile.slug %}" class="map-pin{% if tile.is_home %} is-home{% endif %}{% if tile.has_game %} has-game{% endif %}{% if tile.is_social %} is-social{% endif %}"
         aria-label="{{ tile.name }}: {{ tile.credits }} credit{{ tile.credits|pluralize }}{% if tile.is_home %}, your home school{% endif %}{% if tile.has_game %}, minigame open{% endif %}">
        <g transform="translate({{ tile.pin.x }} {{ tile.pin.y }})">
          <path class="pin-marker" d="M0 0 C -6 -10 -14 -16 -14 -26 A 14 14 0 1 1 14 -26 C 14 -16 6 -10 0 0 Z"/>
          <circle class="pin-dot" cy="-26" r="5"/>
          {% if tile.pin.label == "left" %}
            <g transform="translate(-20 -44)">
              <rect class="pin-label" x="-132" width="132" height="38" rx="5"/>
              <text class="pin-name" x="-122" y="17">{{ tile.name }}{% if tile.is_home %} ★{% endif %}</text>
              <text class="pin-credits" x="-122" y="31">{{ tile.credits }} {% if tile.is_social %}social {% endif %}credit{{ tile.credits|pluralize }}{% if tile.has_game %} · play{% endif %}</text>
            </g>
          {% else %}
            <g transform="translate(20 -44)">
              <rect class="pin-label" width="132" height="38" rx="5"/>
              <text class="pin-name" x="10" y="17">{{ tile.name }}{% if tile.is_home %} ★{% endif %}</text>
              <text class="pin-credits" x="10" y="31">{{ tile.credits }} {% if tile.is_social %}social {% endif %}credit{{ tile.credits|pluralize }}{% if tile.has_game %} · play{% endif %}</text>
            </g>
          {% endif %}
        </g>
      </a>
    {% endfor %}
  </svg>
  <figcaption>Central New Haven, simplified. ★ marks your home school; red pins have a game to play. Tap a place to visit.</figcaption>
</figure>
